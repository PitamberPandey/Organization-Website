<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Pluto Associates | IT & Legal Services in Nepal</title>

    <!-- SEO Meta -->
    <meta
      name="description"
      content="Pluto Associates provides professional IT and legal services in Nepal, including software development, IT consulting, compliance, and legal advisory for businesses and individuals."
    />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://plutoassociates.com/" />

    <!-- Open Graph (Facebook/LinkedIn) -->
    <meta property="og:title" content="Pluto Associates | IT & Legal Services" />
    <meta
      property="og:description"
      content="Expert IT and legal solutions in Nepal. Services include software development, IT consulting, legal compliance, and advisory."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://plutoassociates.com/" />
    <meta property="og:image" content="https://plutoassociates.com/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pluto Associates | IT & Legal Services" />
    <meta
      name="twitter:description"
      content="Providing IT solutions and legal services in Nepal for businesses and individuals."
    />
    <meta name="twitter:image" content="https://plutoassociates.com/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Structured Data (Professional Service + Services Offered) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Pluto Associates",
        "url": "https://plutoassociates.com",
        "logo": "https://plutoassociates.com/logo.png",
        "description": "Pluto Associates provides IT solutions and legal services in Nepal, including software development, IT consulting, compliance, and legal advisory.",
        "areaServed": "Nepal",
        "sameAs": [
          "https://www.facebook.com/PlutoAssociates",
          "https://www.instagram.com/plutoassociates",
          "https://www.tiktok.com/@plutoassociates"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Our Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "name": "IT Services",
              "url": "https://plutoassociates.com/it-services"
            },
            {
              "@type": "Offer",
              "name": "Legal Services",
              "url": "https://plutoassociates.com/law-services"
            },
            {
              "@type": "Offer",
              "name": "Document Services",
              "url": "https://plutoassociates.com/publish"
            }
          ]
        }
      }
    </script>
  </head>

  <body>
    <!-- Header (Optional) -->
    <header>
      <nav>
        <!-- Logo + Main navigation links for Google & users -->
        <a href="/" title="Pluto Associates Homepage">Pluto Associates</a>
        <a href="/it-services" title="IT Services">IT Services</a>
        <a href="/law-services" title="Legal Services">Legal Services</a>
        <a href="/publish" title="Documents / Publish">Documents</a>
        <a href="/contact" title="Contact Us">Contact</a>
      </nav>
    </header>

    <!-- Main React App -->
    <main>
      <div id="root"></div>
    </main>

    <!-- Fallback for no JavaScript -->
    <noscript>
      <p>
        Pluto Associates provides IT and legal services in Nepal. Enable JavaScript to view the full site.
      </p>
    </noscript>

    <!-- Vite React Entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
